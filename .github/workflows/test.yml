name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-dejavu-core
      - name: Install Pillow
        run: python3 -m pip install pillow
      - name: Run tests
        run: python3 -m unittest discover -v
